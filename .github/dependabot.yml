# Monthly dependency updates, grouped so each ecosystem produces at most a few pull requests.
# The Android workflow builds and lints the app on every Gradle update.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Android Gradle plugin, AndroidX and Compose.
      androidx:
        patterns:
          - "androidx.*"
          - "com.android.*"
      # Kotlin, its Gradle plugins (incl. the Compose compiler) and kotlinx libraries. The Kotlin
      # version must stay supported by the Android Gradle plugin; see the KGP compatibility table.
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
      other:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      # gradle/actions v6 moved caching into a closed-source component that requires accepting
      # extra terms of use; stay on v5 until that is a deliberate decision.
      - dependency-name: "gradle/actions*"
        update-types: ["version-update:semver-major"]
