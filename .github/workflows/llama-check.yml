# Runs the app's on-device story code (app/src/main/cpp/story.cpp, issue #51) on Linux with every
# open model of the catalog, built with AddressSanitizer: crashes and memory errors in our code or
# with a model show up here, without a phone. Phone-specific problems (CPU variants, memory
# limits) don't; see CrashReport in the app for those.
name: Llama check

on:
  pull_request:
    paths:
      - 'app/src/main/cpp/**'
      - 'tools/llama-check/**'
      - 'core/src/main/kotlin/io/github/atrejoe/travelguide/core/enhance/**'
      - '.github/workflows/llama-check.yml'
  workflow_dispatch:

concurrency:
  group: llama-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Llama check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: true
      - name: Write the app's sample prompt
        run: ./gradlew :core:test -PcoreOnly=true --tests '*LocalStoryEnhancerTest*'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/models
          key: llama-models-${{ hashFiles('core/src/main/kotlin/io/github/atrejoe/travelguide/core/enhance/LocalStoryEnhancer.kt') }}
      - name: Download the models
        run: |
          mkdir -p ~/models
          python3 - > models.txt <<'EOF'
          import re
          src = open("core/src/main/kotlin/io/github/atrejoe/travelguide/core/enhance/LocalStoryEnhancer.kt").read()
          for block in re.findall(r"LocalModel\((.*?)\n    \)", src, re.S):
              get = lambda k: re.search(k + r' = "([^"]+)"', block).group(1)
              print(get("id"), get("url"), get("sha256"))
          EOF
          cat models.txt
          while read -r id url sha; do
            file=~/models/"$id".gguf
            [[ -f "$file" ]] || curl -fsSL --retry 3 -o "$file" "$url"
            echo "$sha  $file" | sha256sum -c -
          done < models.txt
      - name: Build
        run: |
          cmake -S tools/llama-check -B build-check -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLLAMA_SANITIZE_ADDRESS=ON
          cmake --build build-check -j "$(nproc)"
      - name: Retell the sample story with every model
        run: |
          status=0
          while read -r id url sha; do
            echo "::group::$id"
            prompts=core/build/llama-check
            if ! ./build-check/llama-check ~/models/"$id".gguf "$prompts/system.txt" "$prompts/user.txt" "$prompts/$id.suffix"; then
              echo "::error::$id failed"
              status=1
            fi
            echo "::endgroup::"
          done < models.txt
          exit $status
