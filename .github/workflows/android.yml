# Builds and lints the Android app. Actions minutes are free for public repositories, but Android
# builds still take minutes, so this runs only when app-related files change.
#
# - Pull requests: the APK is attached to the run as an artifact (one per PR).
# - Every merge to main: tagged and published as an alpha pre-release, v<appVersion>-alpha.N, with
#   the APK and the PRs merged since the previous tag as notes. Then the screenshots in
#   docs/screenshots are re-rendered and, when they changed, pushed to bot/screenshots with a link
#   to create the PR.
# - Manual runs: the APK (and the screenshots) as run artifacts.
# - `v*` tags pushed by hand (stable releases): the APK is attached to that release, with its
#   CHANGELOG.md section as notes.
#
# Every build is signed with the same key (repository secrets SIGNING_*, see CONTRIBUTING.md) so a
# newer build installs over an older one (issue #15). Without the secrets it falls back to a debug
# build signed with a throwaway key.
name: Android

on:
  pull_request:
    paths:
      - 'app/**'
      - 'core/src/main/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'sherpa-onnx.version'
      - 'scripts/fetch-sherpa-onnx.sh'
      - '.github/workflows/android.yml'
  # Every merge to main, whatever it changes, so every merge gets its alpha tag.
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# A newer push to a PR makes its running build pointless; on main every merge must get its tag.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write # publish the preview pre-release and release assets
  pull-requests: write # comment the APK link on the pull request
  issues: write # PR comments go through the issues API

jobs:
  apk:
    name: Build & lint APK
    # The bot's screenshot merges change only images: no new build or tag for those.
    if: "!startsWith(github.event.head_commit.message, 'docs: update screenshots')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache sherpa-onnx
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            app/libs/sherpa-onnx.aar
            app/libs/sherpa-onnx.aar.version
          key: sherpa-onnx-${{ hashFiles('sherpa-onnx.version') }}
      - name: Fetch sherpa-onnx
        run: scripts/fetch-sherpa-onnx.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # versionCode: Android refuses to install a lower versionCode over a higher one, so it must
      # only ever go up, across PRs, main, tags and re-runs. Run numbers restart when the workflow is
      # renamed and are shared by PR and main builds, so use minutes since 2026-01-01T00:00:00Z
      # (epoch 1767225600) instead. That fits in an Int for thousands of years.
      # versionName: appVersion from gradle.properties plus -prN.run / -dev.run, -alpha.N for merges
      # to main (N one above the highest existing v<appVersion>-alpha.* tag), or the tag without "v".
      - name: Version
        id: version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          code=$(( ($(date -u +%s) - 1767225600) / 60 ))
          base=$(sed -n 's/^appVersion=//p' gradle.properties | tr -d '[:space:]')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF#refs/tags/v}"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            last=$(git ls-remote --tags origin "refs/tags/v${base}-alpha.*" \
              | sed -n "s|.*refs/tags/v${base}-alpha\.\([0-9]*\)$|\1|p" | sort -n | tail -1)
            name="${base}-alpha.$(( ${last:-0} + 1 ))"
            echo "tag=v$name" >> "$GITHUB_OUTPUT"
          elif [[ -n "$PR_NUMBER" ]]; then
            name="${base}-pr${PR_NUMBER}.${GITHUB_RUN_NUMBER}"
          else
            name="${base}-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "versionCode=$code versionName=$name"

      # Decode the stable signing key, if the repository has one. Secrets are not available to
      # pull requests from forks, so those fall back to a debug build with a throwaway key.
      - name: Signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            keystore="$RUNNER_TEMP/travelguide-signing.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
            echo "keystore=$keystore" >> "$GITHUB_OUTPUT"
            echo "variant=release" >> "$GITHUB_OUTPUT"
            echo "Signing with the stable key; building the release variant."
          else
            echo "keystore=" >> "$GITHUB_OUTPUT"
            echo "variant=debug" >> "$GITHUB_OUTPUT"
            echo "::warning title=No stable signing key::The SIGNING_* secrets are not set (or not available to this run), so this APK is signed with a throwaway debug key and will not install over other builds. See https://github.com/${GITHUB_REPOSITORY}/blob/main/CONTRIBUTING.md#signing"
          fi

      # Lint stays on the debug variant (lint.checkReleaseBuilds is off); it checks the same sources.
      - name: Build and lint
        env:
          VARIANT: ${{ steps.signing.outputs.variant }}
          TRAVELGUIDE_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore }}
          TRAVELGUIDE_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          TRAVELGUIDE_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          TRAVELGUIDE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          # Opt-in crash reports (issue #56); without it the app never reports.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          task=":app:assemble${VARIANT^}"
          ./gradlew "$task" :app:lintDebug :core:test \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName=${{ steps.version.outputs.name }}

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/travelguide-signing.jks"

      # Native crash reports (llama.cpp) only show function names and lines with the debug
      # symbols, which the APK leaves out. Uploaded for stable-signed builds when Sentry is set up.
      - name: Upload native debug symbols to Sentry
        if: steps.signing.outputs.variant == 'release'
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          if [[ -z "$SENTRY_AUTH_TOKEN" || -z "$SENTRY_ORG" || -z "$SENTRY_PROJECT" ]]; then
            echo "Sentry is not set up (SENTRY_AUTH_TOKEN, SENTRY_ORG, SENTRY_PROJECT); skipping."
            exit 0
          fi
          npx --yes @sentry/cli@3.8.0 debug-files upload --include-sources \
            app/build/intermediates/merged_native_libs/release

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Rename APK
        run: |
          mkdir -p out
          variant="${{ steps.signing.outputs.variant }}"
          cp "app/build/outputs/apk/$variant/app-$variant.apk" "out/travelguide-${{ steps.version.outputs.name }}.apk"

      - name: Upload APK artifact
        id: apk
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Artifact storage can be temporarily blocked by account quota; the build itself still counts.
        continue-on-error: true
        with:
          name: travelguide-${{ steps.version.outputs.name }}
          path: out/*.apk
          retention-days: 14

      # One comment per PR, updated on every build, so the APK is easy to find.
      - name: Link APK on the pull request
        if: github.event_name == 'pull_request' && steps.apk.outputs.artifact-url != ''
        continue-on-error: true # a convenience; never fail the build over it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.apk.outputs.artifact-url }}
          VERSION: ${{ steps.version.outputs.name }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- apk-link -->'
          body="$marker
          📱 **Test build ready:** [travelguide-$VERSION.apk]($URL) (commit ${SHA:0:7}).
          Download the zip while logged in to GitHub, unzip it on your phone and open the APK.
          Signed with the ${{ steps.signing.outputs.variant == 'release' && 'stable key: it installs over earlier builds' || 'throwaway debug key: uninstall other builds first' }}."
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$marker\"))][0].id // empty")
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" --body "$body"
          fi

      - name: Upload APK artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: travelguide-${{ steps.version.outputs.name }}
          path: out/*.apk
          retention-days: 14

      # Creating the release creates the tag. Tags made with the workflow token don't start
      # workflows, so this doesn't trigger the tag build below a second time.
      - name: Publish alpha release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" out/*.apk --prerelease --target "$GITHUB_SHA" \
            --title "$TAG" --generate-notes
          # The rolling preview pre-release is replaced by these alpha releases.
          gh release delete preview --yes --cleanup-tag 2>/dev/null || true

      # Release notes: the matching "## [x.y.z]" section of CHANGELOG.md, else GitHub's generated notes.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; keeping its notes."
          elif grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            echo "::warning::No '## [$VERSION]' section in CHANGELOG.md; using generated release notes."
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" out/*.apk --clobber

  # Screenshots for the README, rendered on the JVM (Robolectric + Roborazzi, no emulator). Only
  # after a merge to main (and on manual runs), so pull requests don't pay for it. Changed images
  # are pushed to the bot/screenshots branch, and the run summary links to a ready-made PR: merging
  # it is one click, whenever convenient, and nobody's PR waits for it. Workflows deliberately can't
  # open or approve PRs in this repository (Settings → Actions → General), so a compromised step
  # can't get code into main on its own.
  screenshots:
    name: Screenshots
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
       !startsWith(github.event.head_commit.message, 'docs: update screenshots'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push the bot/screenshots branch
      pull-requests: read # find an open screenshots PR and the PR that was merged
      issues: write # comment the link on the merged PR (comments only; it can't create or merge PRs)
      actions: write # start the required check on the bot's branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: true
      - name: Cache sherpa-onnx
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            app/libs/sherpa-onnx.aar
            app/libs/sherpa-onnx.aar.version
          key: sherpa-onnx-${{ hashFiles('sherpa-onnx.version') }}
      - name: Fetch sherpa-onnx
        run: scripts/fetch-sherpa-onnx.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The map tiles in the screenshots come from a committed archive; only fetched when it's
      # missing (to be committed from the screenshots-preview branch of a manual run).
      - name: Map tiles for the screenshots
        run: |
          if [ ! -f app/src/test/resources/screenshot-tiles.zip ]; then
            scripts/fetch-screenshot-tiles.sh
          fi

      - name: Render screenshots
        run: ./gradlew :app:recordRoborazziDebug

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: screenshots
          path: |
            docs/screenshots
            app/build/outputs/roborazzi
          retention-days: 14

      # A manual run on any branch shows how its screens look, without touching main or the PR.
      - name: Share them for review (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B bot/screenshots-preview
          git add docs/screenshots app/src/test/resources/screenshot-tiles.zip
          git commit --allow-empty -m "docs: screenshots of ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}"
          git push --force origin bot/screenshots-preview
          echo "::notice title=Screenshots::Pushed to the bot/screenshots-preview branch (docs/screenshots)."

      - name: Propose them for main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain -- docs/screenshots)" ]; then
            echo "Screenshots are up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch=bot/screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add docs/screenshots
          git commit -m "docs: update screenshots" -m "Rendered from ${GITHUB_SHA::7} by the Android workflow."
          git push --force origin "$branch"
          # The required check must exist on this commit before the PR can merge, but pushes made
          # with the workflow token don't start workflows and CI skips docs-only PRs. A dispatch
          # runs it now, so the PR is mergeable as soon as it's opened.
          gh workflow run ci.yml --ref "$branch"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "The open screenshots PR has been updated with the new images." >> "$GITHUB_STEP_SUMMARY"
          else
            title="docs: update screenshots"
            body="Screenshots re-rendered after ${GITHUB_SHA::7} by the Android workflow."
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1&title=$(jq -rn --arg v "$title" '$v|@uri')&body=$(jq -rn --arg v "$body" '$v|@uri')"
            message="📸 **The screenshots changed** with this merge. They are on the \`$branch\` branch: [create the pull request]($url), then merge it whenever convenient."
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Screenshots changed::Create the PR from $branch: $url"
            # Also on the PR that was just merged, so the link arrives as a notification.
            merged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty' || true)
            if [ -n "$merged" ]; then
              gh api "repos/$GITHUB_REPOSITORY/issues/$merged/comments" -f body="$message" > /dev/null \
                || echo "::warning::Could not comment on #$merged."
            fi
          fi
