# Builds and lints the Android app. Actions minutes are free for public repositories, but Android
# builds still take minutes, so this runs only when app-related files change.
#
# - Pull requests: the APK is attached to the run as an artifact (one per PR).
# - Pushes to main / manual runs: the APK replaces the rolling `preview` pre-release.
# - `v*` tags: the APK is attached to that release.
name: Android

on:
  pull_request:
    paths:
      - 'app/**'
      - 'core/src/main/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'sherpa-onnx.version'
      - 'scripts/fetch-sherpa-onnx.sh'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    tags: ['v*']
    # Path filters are not applied to tag pushes.
    paths:
      - 'app/**'
      - 'core/src/main/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'sherpa-onnx.version'
      - 'scripts/fetch-sherpa-onnx.sh'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # publish the preview pre-release and release assets
  pull-requests: write # comment the APK link on the pull request
  issues: write # PR comments go through the issues API

jobs:
  apk:
    name: Build & lint APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache sherpa-onnx
        uses: actions/cache@v6
        with:
          path: |
            app/libs/sherpa-onnx.aar
            app/libs/sherpa-onnx.aar.version
          key: sherpa-onnx-${{ hashFiles('sherpa-onnx.version') }}
      - name: Fetch sherpa-onnx
        run: scripts/fetch-sherpa-onnx.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.pull_request.number }}" ]]; then
            echo "name=0.1.0-pr${{ github.event.pull_request.number }}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.1.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and lint
        run: >
          ./gradlew :app:assembleDebug :app:lintDebug :core:test
          -PversionCode=${{ github.run_number }}
          -PversionName=${{ steps.version.outputs.name }}

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/travelguide-${{ steps.version.outputs.name }}.apk"

      - name: Upload APK artifact
        id: apk
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        # Artifact storage can be temporarily blocked by account quota; the build itself still counts.
        continue-on-error: true
        with:
          name: travelguide-${{ steps.version.outputs.name }}
          path: out/*.apk
          retention-days: 14

      # One comment per PR, updated on every build, so the APK is easy to find.
      - name: Link APK on the pull request
        if: github.event_name == 'pull_request' && steps.apk.outputs.artifact-url != ''
        continue-on-error: true # a convenience; never fail the build over it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.apk.outputs.artifact-url }}
          VERSION: ${{ steps.version.outputs.name }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- apk-link -->'
          body="$marker
          📱 **Test build ready:** [travelguide-$VERSION.apk]($URL) (commit ${SHA:0:7}).
          Download the zip while logged in to GitHub, unzip it on your phone and open the APK."
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$marker\"))][0].id // empty")
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" --body "$body"
          fi

      - name: Publish preview pre-release
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete preview --yes --cleanup-tag || true
          gh release create preview out/*.apk --prerelease --target "$GITHUB_SHA" \
            --title "Preview build ${{ steps.version.outputs.name }}" \
            --notes "Latest development build of ${GITHUB_REF_NAME} (commit ${GITHUB_SHA}). Not a stable release."

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" out/*.apk --clobber
