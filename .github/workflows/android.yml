# Builds and lints the Android app. Actions minutes are free for public repositories, but Android
# builds still take minutes, so this runs only when app-related files change.
#
# - Pull requests: the APK is attached to the run as an artifact (one per PR).
# - Pushes to main / manual runs: the APK replaces the rolling `preview` pre-release.
# - `v*` tags: the APK is attached to that release, with its CHANGELOG.md section as notes.
#
# Every build is signed with the same key (repository secrets SIGNING_*, see CONTRIBUTING.md) so a
# newer build installs over an older one (issue #15). Without the secrets it falls back to a debug
# build signed with a throwaway key.
name: Android

on:
  pull_request:
    paths:
      - 'app/**'
      - 'core/src/main/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'sherpa-onnx.version'
      - 'scripts/fetch-sherpa-onnx.sh'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    tags: ['v*']
    # Path filters are not applied to tag pushes.
    paths:
      - 'app/**'
      - 'core/src/main/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'sherpa-onnx.version'
      - 'scripts/fetch-sherpa-onnx.sh'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # publish the preview pre-release and release assets
  pull-requests: write # comment the APK link on the pull request
  issues: write # PR comments go through the issues API

jobs:
  apk:
    name: Build & lint APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache sherpa-onnx
        uses: actions/cache@v6
        with:
          path: |
            app/libs/sherpa-onnx.aar
            app/libs/sherpa-onnx.aar.version
          key: sherpa-onnx-${{ hashFiles('sherpa-onnx.version') }}
      - name: Fetch sherpa-onnx
        run: scripts/fetch-sherpa-onnx.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # versionCode: Android refuses to install a lower versionCode over a higher one, so it must
      # only ever go up, across PRs, main, tags and re-runs. Run numbers restart when the workflow is
      # renamed and are shared by PR and main builds, so use minutes since 2026-01-01T00:00:00Z
      # (epoch 1767225600) instead. That fits in an Int for thousands of years.
      # versionName: appVersion from gradle.properties plus -prN.run / -dev.run, or the tag without "v".
      - name: Version
        id: version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          code=$(( ($(date -u +%s) - 1767225600) / 60 ))
          base=$(sed -n 's/^appVersion=//p' gradle.properties | tr -d '[:space:]')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "$PR_NUMBER" ]]; then
            name="${base}-pr${PR_NUMBER}.${GITHUB_RUN_NUMBER}"
          else
            name="${base}-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "versionCode=$code versionName=$name"

      # Decode the stable signing key, if the repository has one. Secrets are not available to
      # pull requests from forks, so those fall back to a debug build with a throwaway key.
      - name: Signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            keystore="$RUNNER_TEMP/travelguide-signing.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
            echo "keystore=$keystore" >> "$GITHUB_OUTPUT"
            echo "variant=release" >> "$GITHUB_OUTPUT"
            echo "Signing with the stable key; building the release variant."
          else
            echo "keystore=" >> "$GITHUB_OUTPUT"
            echo "variant=debug" >> "$GITHUB_OUTPUT"
            echo "::warning title=No stable signing key::The SIGNING_* secrets are not set (or not available to this run), so this APK is signed with a throwaway debug key and will not install over other builds. See https://github.com/${GITHUB_REPOSITORY}/blob/main/CONTRIBUTING.md#signing"
          fi

      # Lint stays on the debug variant (lint.checkReleaseBuilds is off); it checks the same sources.
      - name: Build and lint
        env:
          VARIANT: ${{ steps.signing.outputs.variant }}
          TRAVELGUIDE_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore }}
          TRAVELGUIDE_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          TRAVELGUIDE_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          TRAVELGUIDE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          task=":app:assemble${VARIANT^}"
          ./gradlew "$task" :app:lintDebug :core:test \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName=${{ steps.version.outputs.name }}

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/travelguide-signing.jks"

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Rename APK
        run: |
          mkdir -p out
          variant="${{ steps.signing.outputs.variant }}"
          cp "app/build/outputs/apk/$variant/app-$variant.apk" "out/travelguide-${{ steps.version.outputs.name }}.apk"

      - name: Upload APK artifact
        id: apk
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        # Artifact storage can be temporarily blocked by account quota; the build itself still counts.
        continue-on-error: true
        with:
          name: travelguide-${{ steps.version.outputs.name }}
          path: out/*.apk
          retention-days: 14

      # One comment per PR, updated on every build, so the APK is easy to find.
      - name: Link APK on the pull request
        if: github.event_name == 'pull_request' && steps.apk.outputs.artifact-url != ''
        continue-on-error: true # a convenience; never fail the build over it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.apk.outputs.artifact-url }}
          VERSION: ${{ steps.version.outputs.name }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- apk-link -->'
          body="$marker
          📱 **Test build ready:** [travelguide-$VERSION.apk]($URL) (commit ${SHA:0:7}).
          Download the zip while logged in to GitHub, unzip it on your phone and open the APK.
          Signed with the ${{ steps.signing.outputs.variant == 'release' && 'stable key: it installs over earlier builds' || 'throwaway debug key: uninstall other builds first' }}."
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$marker\"))][0].id // empty")
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" --body "$body"
          fi

      - name: Publish preview pre-release
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete preview --yes --cleanup-tag || true
          gh release create preview out/*.apk --prerelease --target "$GITHUB_SHA" \
            --title "Preview build ${{ steps.version.outputs.name }}" \
            --notes "Latest development build of ${GITHUB_REF_NAME} (commit ${GITHUB_SHA}). Not a stable release."

      # Release notes: the matching "## [x.y.z]" section of CHANGELOG.md, else GitHub's generated notes.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; keeping its notes."
          elif grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            echo "::warning::No '## [$VERSION]' section in CHANGELOG.md; using generated release notes."
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" out/*.apk --clobber
