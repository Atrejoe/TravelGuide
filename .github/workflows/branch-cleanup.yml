name: Branch cleanup

# Deletes a pull request's branch once it is merged, like GitHub's "Automatically delete head
# branches" setting. Run by hand (Actions tab) to delete every branch merged before this existed.
# A branch is kept when it is the default branch, got commits after its merge, is used by an open
# pull request, or comes from a fork.
on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write # delete branches
  pull-requests: read # find merged and open pull requests

jobs:
  cleanup:
    name: Delete merged branches
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Deletes branch $1 if it still points at $2, the merged pull request's last commit.
          delete_merged() {
            local branch=$1 sha=$2 tip open
            if [ "$branch" = "${DEFAULT_BRANCH:-main}" ]; then
              echo "Keeping $branch: the default branch."; return
            fi
            tip=$(gh api "repos/$REPO/git/ref/heads/$branch" --jq .object.sha 2>/dev/null || true)
            if [ -z "$tip" ]; then return; fi # already gone
            if [ "$tip" != "$sha" ]; then
              echo "Keeping $branch: it has commits after its merge."; return
            fi
            open=$(gh pr list --repo "$REPO" --state open --head "$branch" --json number --jq length)
            if [ "$open" != 0 ]; then
              echo "Keeping $branch: an open pull request uses it."; return
            fi
            gh api -X DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null
            echo "Deleted $branch." | tee -a "$GITHUB_STEP_SUMMARY"
          }

          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            delete_merged "$BRANCH" "$SHA"
          else
            gh pr list --repo "$REPO" --state merged --limit 1000 \
              --json headRefName,headRefOid,isCrossRepository \
              --jq '.[] | select(.isCrossRepository | not) | "\(.headRefName) \(.headRefOid)"' |
              while read -r branch sha; do delete_merged "$branch" "$sha"; done
          fi
