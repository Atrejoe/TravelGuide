name: Release notes

# Replaces a release's notes with its "## [x.y.z]" section of CHANGELOG.md, e.g. for a release
# created in GitHub's interface with generated notes (the Android workflow keeps an existing
# release's notes). Run it from the Actions tab with the tag, e.g. v0.8.0.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.8.0
        required: true

permissions:
  contents: write # edit the release

jobs:
  notes:
    name: Release notes from CHANGELOG.md
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Use the CHANGELOG section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::No '## [$version]' section in CHANGELOG.md at $TAG."
            exit 1
          fi
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          echo "Release $TAG now has the notes of CHANGELOG.md's [$version] section." >> "$GITHUB_STEP_SUMMARY"
